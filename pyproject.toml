[project]
name = "unienv_mjlab"
version = "0.0.1a1"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">= 3.10"
dependencies = [
    "unienv>=0.0.1b16",
    "mjlab>=1.2",
]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/mjlab_adaptor"
Documentation = "https://github.com/UniEnvOrg/mjlab_adaptor"
Repository = "https://github.com/UniEnvOrg/mjlab_adaptor"
Issues = "https://github.com/UniEnvOrg/mjlab_adaptor/issues"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["training*", "tests*"]
